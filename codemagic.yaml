workflows:
  vokza-testflight:
    name: VOKZA TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: party-box
    environment:
      xcode: latest
      node: 24
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.partyverse.kayipsinyal
      vars:
        VITE_COLYSEUS_URL: wss://partyverse.partybox.cloud
    scripts:
      - name: Prepare iOS assets
        script: |
          npm ci
          npm run ios:prepare
      - name: Sign and archive
        script: |
          xcode-project use-profiles
          cd ios/App
          agvtool new-version -all "${BUILD_NUMBER}"
          cd ../..
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

