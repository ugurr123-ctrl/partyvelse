<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f1842" />
      <stop offset="100%" stop-color="#070510" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00a8ff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Hexagonal Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)" />
  <rect width="496" height="496" x="8" y="8" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />

  <!-- Tactical Hexagon -->
  <polygon points="256,60 430,160 430,352 256,452 82,352 82,160" fill="#141123" stroke="url(#goldGrad)" stroke-width="12" filter="url(#neonGlow)" />
  <polygon points="256,90 400,175 400,337 256,422 112,337 112,175" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.4" stroke-dasharray="12,8" />

  <!-- Radar / Signal Concentric Rings -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#00f0ff" stroke-width="4" opacity="0.3" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="url(#cyanGrad)" stroke-width="6" opacity="0.7" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="30" fill="url(#goldGrad)" filter="url(#neonGlow)" />

  <!-- Crosshair Radar Lines -->
  <line x1="256" y1="130" x2="256" y2="382" stroke="#00f0ff" stroke-width="4" opacity="0.6" stroke-linecap="round" />
  <line x1="130" y1="256" x2="382" y2="256" stroke="#00f0ff" stroke-width="4" opacity="0.6" stroke-linecap="round" />

  <!-- Mini Beacon Points -->
  <circle cx="256" cy="170" r="7" fill="#ffe066" />
  <circle cx="330" cy="256" r="7" fill="#00f0ff" />
  <circle cx="182" cy="256" r="7" fill="#ffb703" />
  <circle cx="256" cy="342" r="7" fill="#00f0ff" />
</svg>
